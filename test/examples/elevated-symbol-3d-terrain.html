<!doctype html>
<html lang="en">
    <head>
        <title>Elevated Symbol on 3D Terrain</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="../../dist/maplibre-gl.css" />
        <script src="../../dist/maplibre-gl-dev.js"></script>
        <style>
            body {
                margin: 0;
                padding: 0;
            }
            html,
            body,
            #map {
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <script>
            const map = new maplibregl.Map({
                container: "map",
                zoom: 17,
                center: [11.39085, 47.27574],
                pitch: 75,
                style: {
                    version: 8,
                    sources: {
                        osm: {
                            type: "raster",
                            tiles: [
                                "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png",
                            ],
                            tileSize: 256,
                            attribution: "&copy; OpenStreetMap Contributors",
                            maxzoom: 19,
                        },
                        terrainSource: {
                            type: "raster-dem",
                            url: "https://demotiles.maplibre.org/terrain-tiles/tiles.json",
                            tileSize: 256,
                        },
                    },
                    layers: [
                        {
                            id: "osm",
                            type: "raster",
                            source: "osm",
                        },
                    ],
                    terrain: {
                        source: "terrainSource",
                        exaggeration: 1.5,
                    },
                    sky: {},
                },
                maxZoom: 18,
                maxPitch: 85,
            });

            map.addControl(new maplibregl.NavigationControl());

            map.on("load", async () => {
                const image = await map.loadImage(
                    "https://upload.wikimedia.org/wikipedia/commons/7/7c/201408_cat.png",
                );
                map.addImage("cat", image.data);

                map.addSource("point", {
                    type: "geojson",
                    data: {
                        type: "FeatureCollection",
                        features: [
                            {
                                type: "Feature",
                                properties: {
                                    height: 50,
                                },
                                geometry: {
                                    type: "Point",
                                    coordinates: [11.39085, 47.27574],
                                },
                            },
                        ],
                    },
                });
                map.addLayer({
                    id: "elevated-symbol",
                    type: "symbol",
                    source: "point",
                    layout: {
                        "icon-image": "cat",
                        "icon-size": 0.25,
                        "elevation-offset": [
                            "+",
                            ["elevation"],
                            ["get", "height"],
                        ],
                    },
                });
            });
        </script>
    </body>
</html>
