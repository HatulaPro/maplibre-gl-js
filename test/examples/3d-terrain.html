<!doctype html>
<html lang="en">
    <head>
        <title>3D Terrain</title>
        <meta
            property="og:description"
            content="Go beyond hillshade and show elevation in actual 3D."
        />
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="../../dist/maplibre-gl.css" />
        <script src="../../dist/maplibre-gl-dev.js"></script>
        <style>
            body {
                margin: 0;
                padding: 0;
            }
            html,
            body,
            #map {
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <script>
            const map = (window.map = new maplibregl.Map({
                container: "map",
                zoom: 12,
                center: [11.39085, 47.27574],
                pitch: 70,
                hash: true,
                style: {
                    version: 8,
                    sources: {
                        osm: {
                            type: "raster",
                            tiles: [
                                "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png",
                            ],
                            tileSize: 256,
                            attribution: "&copy; OpenStreetMap Contributors",
                            maxzoom: 19,
                        },
                        // Use a different source for terrain and hillshade layers, to improve render quality
                        terrainSource: {
                            type: "raster-dem",
                            url: "https://demotiles.maplibre.org/terrain-tiles/tiles.json",
                            tileSize: 256,
                        },
                        hillshadeSource: {
                            type: "raster-dem",
                            url: "https://demotiles.maplibre.org/terrain-tiles/tiles.json",
                            tileSize: 256,
                        },
                    },
                    layers: [
                        {
                            id: "osm",
                            type: "raster",
                            source: "osm",
                        },
                        {
                            id: "hills",
                            type: "hillshade",
                            source: "hillshadeSource",
                            layout: { visibility: "visible" },
                            paint: { "hillshade-shadow-color": "#473B24" },
                        },
                    ],
                    terrain: {
                        source: "terrainSource",
                        exaggeration: 1,
                    },
                    sky: {},
                },
                maxZoom: 18,
                maxPitch: 85,
            }));

            map.addControl(
                new maplibregl.NavigationControl({
                    visualizePitch: true,
                    showZoom: true,
                    showCompass: true,
                }),
            );

            map.addControl(
                new maplibregl.TerrainControl({
                    source: "terrainSource",
                    exaggeration: 1,
                }),
            );

            map.on("load", async () => {
                map.setMaxPitch(80);
                map.setPitch(80);
                map.setBearing(14.588904334574636);
                map.setCenter({
                    lng: 11.39085,
                    lat: 47.27574,
                });
                map.setZoom(18);

                image = await map.loadImage(
                    "https://upload.wikimedia.org/wikipedia/commons/7/7c/201408_cat.png",
                );
                map.addImage("cat", image.data);
                map.addSource("point", {
                    type: "geojson",
                    data: {
                        type: "FeatureCollection",
                        features: [
                            {
                                type: "Feature",
                                properties: {
                                    height: 50,
                                    name: "cat",
                                },
                                geometry: {
                                    type: "Point",
                                    coordinates: [11.39085, 47.27574],
                                },
                            },
                            {
                                type: "Feature",
                                properties: {
                                    height: 20,
                                    name: "cat",
                                },
                                geometry: {
                                    type: "Point",
                                    coordinates: [11.39085, 47.27574],
                                },
                            },
                        ],
                    },
                });
                map.addLayer({
                    id: "points",
                    type: "symbol",
                    source: "point",
                    layout: {
                        "icon-image": "cat",
                        "icon-size": 0.25,
                        "text-field": ["get", "name"],
                        "text-size": 12,
                        "elevation-offset": ["get", "height"],
                        "icon-allow-overlap": true,
                        "text-allow-overlap": true,
                    },
                });
                // Adding a polygon around the cat, with fill extrusion height of 10 meters
                map.addSource("polygon", {
                    type: "geojson",
                    data: {
                        type: "FeatureCollection",
                        features: [
                            {
                                type: "Feature",
                                properties: {
                                    height: 10,
                                },
                                geometry: {
                                    type: "Polygon",
                                    coordinates: [
                                        [
                                            [11.39085, 47.27574],
                                            [11.39095, 47.27574],
                                            [11.39095, 47.27584],
                                            [11.39085, 47.27584],
                                            [11.39085, 47.27574],
                                        ],
                                    ],
                                },
                            },
                        ],
                    },
                });
                map.addLayer({
                    id: "polygon",
                    type: "fill-extrusion",
                    source: "polygon",
                    paint: {
                        "fill-extrusion-color": "#00ff00",
                        "fill-extrusion-height": ["get", "height"],
                    },
                });
            });
        </script>
    </body>
</html>
